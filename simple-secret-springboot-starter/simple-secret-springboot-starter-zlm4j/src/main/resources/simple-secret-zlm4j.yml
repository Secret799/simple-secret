simple-secret:
  zlm4j:
    enabled: false
    # 基础配置
    root-path: ./www
    thread-num: 5
    rtmp-port: 7935
    rtsp-port: 7554
    http-port: 7080
    rtc-port: 8000
    http-listener-enabled: true
    rtsp-listener-enabled: true
    rtmp-listener-enabled: true
    rtc-listener-enabled: true
    rtc-host: 127.0.0.1
    snap-timeout-ms: 10000
    # 无人观看(0:表示当无人观看时,会触发无人观看回调 1:表示发生无人观看时直接关闭流)
    auto-close: 0
    stream-none-reader-delay-ms: 30000
    max-stream-wait-ms: 1500
    # 是否转换为该协议
    enable-ts: 1
    enable-hls: 0
    enable-fmp4: 0
    enable-rtsp: 1
    enable-rtmp: 1
    enable-mp4: 0
    enable-hls-fmp4: 0
    # 是否启用音频
    enable-audio: 1
    # 按需拉取配置(为0和1都可以播放,只是为1时对于第一个播放的用户体验不是很好,但是节省资源)
    hls-demand: 1
    rtmp-demand: 1
    ts-demand: 0
    fmp4-demand: 1
    rtsp-demand: 1
    # 录像相关配置
    broadcast-record-ts: 0
    mp4-save-path: ${simple-secret.zlm4j.root-path}
    hls-save-path: ${simple-secret.zlm4j.root-path}
    mp4-as-player: 0
    mp4-max-second: 3600
    hls-seg-dur: 2
    hls-seg-num: 3
    # 点播配置
    record-file-repeat: 1
    # 日志相关配置
    log-level: 2
    log-mask: 1  #1console 2file 4fun
    log-file-days: 1
    log-path: ${simple-secret.zlm4j.root-path}/logs
    listen-ip: 127.0.0.1
    allow-anonymous-play: false
    allow-anonymous-publish: false
    resource-policy:
      allowed-schemes: http,https,rtsp,rtsps,rtmp,rtmps
      allowed-hosts: []
      allowed-cidrs: []
      recording-root: ${simple-secret.zlm4j.root-path}
    video-stack:
      max-pixels: 16777216
      max-dimension: 8192
      max-cells: 256
      max-windows: 64
