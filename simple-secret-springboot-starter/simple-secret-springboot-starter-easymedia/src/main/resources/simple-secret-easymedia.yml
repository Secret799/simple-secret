simple-secret:
  easymedia:
    # 是否启用 EasyMedia 模块
    enabled: false
    # 是否暴露通用媒体管理接口；开启后仍需提供授权策略
    management-api-enabled: false
    # 播放地址模板
    default-play-url-template: "{}://{}:{}/{}/{}.live.ts"
    # 推流地址模板
    default-publish-url-template: "rtmp://{}:{}/{}/{}"
    webrtc:
      enabled: true
      local-zlm-enabled: false
      signaling-base-url: http://127.0.0.1:${simple-secret.zlm4j.http-port:7080}
      connect-timeout: 2s
      request-timeout: 8s
      session-ttl: 1h
      closing-ttl: 5m
      cleanup-interval: PT10S
      cleanup-initial-delay: PT30S
      cleanup-batch-size: 100
      max-sdp-bytes: 65536
      trickle-ice-enabled: false
      public-session-base-path: /easyMedia/api/webrtc/sessions
      security:
        authentication-required: true
        # default-subject: 未接入统一认证时使用的固定主体标识，配置后所有请求以此身份认证
      rate-limit:
        enabled: true
        publish-per-minute: 60
        play-per-minute: 120
        session-operation-per-minute: 300
        key-ttl: 10m
        local-max-keys: 10000
