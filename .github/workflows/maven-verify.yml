name: Maven Verify

on:
  pull_request:
  push:
    branches: ["develop"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: maven-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Verify published module coverage
        run: python3 script/verify-published-module-coverage.py

      - name: Verify reactor
        run: mvn -B clean verify

      - name: Install reactor artifacts
        run: mvn -B install -DskipTests

      - name: Verify independent consumers
        run: mvn -B -f integration-tests/pom.xml test
