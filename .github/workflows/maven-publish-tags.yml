name: Tag Push NEXUS RELEASE

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: read

concurrency:
  group: nexus-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/maven-verify.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Reject tag updates and deletions
        env:
          TAG_CREATED: ${{ github.event.created }}
          TAG_DELETED: ${{ github.event.deleted }}
          TAG_FORCED: ${{ github.event.forced }}
        shell: bash
        run: |
          if [[ "$TAG_CREATED" != "true" ]] \
            || [[ "$TAG_DELETED" == "true" ]] \
            || [[ "$TAG_FORCED" == "true" ]]; then
            echo "Release tags are immutable; create a new x.y.z tag" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use x.y.z format, got: $TAG_VERSION" >&2
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Configure Maven settings.xml
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          servers: |
            [
              {
                "id": "junpzx-custom-nexus-releases",
                "username": "${{ secrets.JUNPZX_NEXUS_USERNAME }}",
                "password": "${{ secrets.JUNPZX_NEXUS_PASSWORD }}"
              },
              {
                "id": "junpzx-custom-nexus-snapshots",
                "username": "${{ secrets.JUNPZX_NEXUS_USERNAME }}",
                "password": "${{ secrets.JUNPZX_NEXUS_PASSWORD }}"
              }
            ]

      - name: Update BOM revision
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 script/set-pom-revision.py \
            simple-secret-common/simple-secret-common-bom/pom.xml \
            "$RELEASE_VERSION"

      - name: Verify Nexus availability
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            https://repository.junpzx.cn/service/rest/v1/status \
            > /dev/null

      - name: Publish release to Nexus
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mvn -B clean deploy \
            -Dmaven.test.skip=true \
            -DskipTests \
            -DdeployAtEnd=true \
            -DretryFailedDeploymentCount=2 \
            -Daether.connector.connectTimeout=30000 \
            -Daether.connector.requestTimeout=120000 \
            -Drevision="$RELEASE_VERSION"

  create-release:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/auto-create-release.yml
